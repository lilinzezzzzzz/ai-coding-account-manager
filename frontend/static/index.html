<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>AI Coding Account Manager</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script src="/theme.js?v=theme-menu-1"></script>
    <link rel="stylesheet" href="/vendor/tabler-1.7.5/tabler.min.css">
    <link rel="stylesheet" href="/app.css?v=tabler-1">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">AI</div>
          <div class="brand-copy">
            <h1>AI Coding Account Manager</h1>
            <p class="brand-caption">本地 AI 编程账号管理</p>
          </div>
        </div>
        <div class="topbar-actions">
          <a class="topbar-link btn btn-outline-secondary" href="https://codexradar.com/" target="_blank" rel="noopener noreferrer">雷达</a>
          <div class="theme-menu" id="theme-menu"></div>
        </div>
      </header>

      <section id="message" class="message" role="status" aria-live="polite" hidden></section>

      <div class="workspace-heading">
        <div>
          <div class="page-pretitle">工作空间</div>
          <h2 class="page-title">账号工作台</h2>
          <p class="workspace-description">查看使用额度，管理套餐与当前活动账号。</p>
        </div>
        <span class="workspace-local"><span class="status-dot bg-green" aria-hidden="true"></span>本地管理</span>
      </div>

      <section id="providers" class="provider-list" aria-label="账号服务商"></section>
    </main>
    <script type="module" src="/app.js?v=tabler-1"></script>
  </body>
</html>
